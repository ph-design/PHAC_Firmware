name: Build Firmware

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Pico SDK
      run: |
        cd $HOME
        git clone https://github.com/raspberrypi/pico-sdk.git --branch master
        cd pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Configure CMake
      run: |
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
    
    - name: Build firmware
      run: |
        cd build
        make -j$(nproc)
    
    - name: Extract version and prepare artifacts
      run: |
        VERSION=$(grep 'FIRMWARE_VERSION' config.h | cut -d'"' -f2)
        DATE=$(date +%Y%m%d)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "BUILD_DATE=$DATE" >> $GITHUB_ENV
        
        # Rename UF2 file with version and date
        cd build
        if [ -f "PHAC-Firmware.uf2" ]; then
          cp PHAC-Firmware.uf2 PHAC-Firmware-v${VERSION}-${DATE}.uf2
        fi
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PHAC-Firmware-v${{ env.VERSION }}-${{ env.BUILD_DATE }}.uf2
        path: build/PHAC-Firmware-v*.uf2
        compression-level: 0
        if-no-files-found: error
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/PHAC-Firmware-v*.uf2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
